# render.yaml  (repo root)

services:
  - type: web
    name: supplychain-web
    env: python
    plan: free
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn supplychain_test.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: supplychain_test.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL                # ⬅ inject Postgres URL into Django
        fromDatabase:
          name: kingfisher-supplychain-postgres           # must match the database’s name
          property: connectionString

databases:                              
  - name: supplychain-db                
    plan: free
    databaseName: supplychain            # initial DB name inside Postgres
    ipAllowList: []                      # empty → accessible only from Render
