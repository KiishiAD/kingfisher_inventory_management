# render.yaml  (repo root)

services:
  - type: web
    name: supplychain-web
    env: python
    plan: free
    branch: main

    rootDir: supplychain_test      # keep this

    buildCommand: |
      pip install -r ../requirements.txt   # ↑ one level up
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput

    # inner package still called "supplychain_test"
    startCommand: gunicorn supplychain_test.wsgi:application

    envVars:
      - key: DJANGO_SETTINGS_MODULE       # match what manage.py expects
        value: supplychain_test.settings
      - key: DJANGO_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kingfisher-supplychain-postgres
          property: connectionString

databases:
  - name: kingfisher-supplychain-postgres
    plan: free
    databaseName: supplychain
    ipAllowList: []
