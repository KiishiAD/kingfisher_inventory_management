{# templates/registration/password_reset_complete.html #}
{% extends "base_login.html" %}
{% block title %}Password updated{% endblock %}

{% block content %}
<div class="container" style="max-width: 440px;">
  <div class="card shadow-sm border-0 mt-5 rounded-4">
    <div class="card-body p-4 p-md-5 text-center">
      <h1 class="h4 mb-2">Password updated</h1>
      <p class="text-muted mb-4">You can now log in with your new password.</p>
      <a class="btn btn-dark rounded-pill px-4 py-2" href="{% url 'login' %}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
